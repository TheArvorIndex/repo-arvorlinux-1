<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title> Arvor Linux Repository 1</title>
<style>
  body { 
    font-family: Consolas, "Courier New", monospace; 
    background: #f5f5f5; 
    color: #333; 
    padding: 20px; 
    margin: 0;
    min-height: 100vh;
    box-sizing: border-box;
    padding-bottom: 80px;
  }
  .header { display: flex; align-items: center; margin-bottom: 20px; }
  .logo { height: 50px; width: auto; margin-right: 15px; }
  h1 { font-size: 24px; margin: 0; }
  ul { list-style: none; padding-left: 0; }
  li { margin: 5px 0; display: flex; align-items: center; }
  a { text-decoration: none; color: #0366d6; }
  a:hover { text-decoration: underline; }
  .folder::before { content: "📁 "; margin-right: 5px; }
  .file::before { content: "📄 "; margin-right: 5px; }
  .deb::before { content: "📦 "; margin-right: 5px; }
  #path { margin-bottom: 10px; font-weight: bold; display: none; }
  .size { margin-left: 20px; color: #666; font-size: 0.9em; }
  
  footer { 
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #333;
    color: #00ff00;
    padding: 10px 20px;
    font-size: 0.9em;
    font-weight: bold;
    border-top: 2px solid #555;
    box-sizing: border-box;
    z-index: 1000;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>

<div class="header">
  <img src="arv.png" alt="Logo" class="logo">
  <h1 id="pageTitle">Index of TheArvorIndex/repo-arvorlinux-1</h1>
</div>

<div id="path">/</div>
<ul id="fileList"></ul>

<footer>
  <span>[ STATUS: ONLINE ]</span>
  <span>Running on GitHub Pages | Image: ubuntu-latest</span>
</footer>

<script>
  const user = "thearvorindex"; 
  const repo = "repo-arvorlinux-1"; 
  const ignoredFiles = ["index.html", "arv.png", ".github"];
  let currentPath = "";

  function loadFiles(path) {
    const url = `https://api.github.com/repos/${user}/${repo}/contents/${path}`;
    fetch(url)
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById("fileList");
        const pathDiv = document.getElementById("path");
        
        list.innerHTML = "";
        const displayPath = path ? "/" + path : "/";
        pathDiv.textContent = displayPath;

        if (path) {
          const li = document.createElement("li");
          li.className = "folder";
          const link = document.createElement("a");
          link.href = "#";
          link.textContent = "..";
          link.onclick = (e) => {
            e.preventDefault();
            const parts = path.split("/").filter(p => p);
            parts.pop();
            currentPath = parts.join("/");
            loadFiles(currentPath);
          };
          li.appendChild(link);
          list.appendChild(li);
        }

        if (Array.isArray(data)) {
          data.forEach(item => {
            if (ignoredFiles.includes(item.name)) return;

            const li = document.createElement("li");
            let cssClass = "file"; 
            if (item.type === "dir") {
                cssClass = "folder";
            } else if (item.name.endsWith(".deb")) {
                cssClass = "deb";
            }
            li.className = cssClass;

            const link = document.createElement("a");
            link.textContent = item.name + (item.type === "dir" ? "/" : "");
            
            if(item.type === "dir") {
                link.href = "#";
                link.onclick = (e) => {
                  e.preventDefault();
                  currentPath = path ? `${path}/${item.name}` : item.name;
                  loadFiles(currentPath);
                };
            } else {
                link.href = item.download_url;
                link.target = "_blank";
            }
            li.appendChild(link);

            if (item.type !== "dir") {
                const sizeSpan = document.createElement("span");
                sizeSpan.className = "size";
                sizeSpan.textContent = item.size + " bytes";
                li.appendChild(sizeSpan);
            }
            list.appendChild(li);
          });
        }
      })
      .catch(err => console.error(err));
  }

  loadFiles(currentPath);
</script>

</body>
</html>
